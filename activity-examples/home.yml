name: home
description: home automation controls
color: "#ffffff"
background: "#4dff00"
weight: 0
shell_prefix: ~/launch.sh
shell_aliases:
  d: discord
  code: code
  kp: keepass
  sc: speedcrunch
  q: qpwgraph
  pavu: pavucontrol
  lm: lm-studio
  key: screenkey
commands:
  #M: ~/morning.sh
  l:
    shell: cd /workspace/agl && bun src/agents/home.mjs "turn pc light rgb(40,0,0) and desk lamp off"
    word: lamp
    voice: '(lights)'
  r: redshift -O 1200
  R: redshift -x
  h: ~/headset.sh
  w: ~/swap-asink.sh zone
  z: ~/swap-asink.sh scarlett
  #B: ~/swap-asink.sh earbuds
  B: ~/swap-asink.sh airpods  
  #m: cd /workspace/miriam && ./start.sh